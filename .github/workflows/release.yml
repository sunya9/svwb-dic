name: Release

on:
  push:
    branches: [main]
    paths:
      - data/**
      - src/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

      - name: Decide tag
        id: tag
        run: |
          tag="v$(date -u +%Y.%m.%d)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag="$tag.${{ github.run_number }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          {
            echo "| データ | 語数 |"
            echo "|---|---|"
            for f in cards keywords tribes card-sets; do
              echo "| $f | $(node -e "console.log(require('./data/$f.json').length)") |"
            done
          } > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes-file notes.md \
            out/svwb-google-ime.txt \
            out/svwb-ms-ime.txt \
            out/svwb-macos-additional.txt \
            out/svwb-text-replacement.plist
